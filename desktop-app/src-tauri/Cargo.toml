[package]
name = "todo-board"
default-run = "todo-board"
version = "0.1.0"
description = "QuestLog — Cross-conversation todo board for Claude Code"
authors = []
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
# staticlib (.a, ~380 MB/build) only serves iOS/Android embedding — this
# project has no mobile target (gen/ holds schemas only); add it back if one
# appears. cdylib serves the Tauri runtime, rlib serves tests/ linking.
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
serde = { version = "1", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-log = "2"
notify = { version = "7", features = ["macos_fsevent"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
# API 响应 gzip（服务端编码 + remote_client 解码，两端同 crate；miniz 纯 Rust 后端）
flate2 = "1"
dirs = "7"
sha2 = "0.10"
# kill(pid, 0) liveness probes for the owner-safe file lock (file_lock.rs).
libc = "0.2"

[dev-dependencies]
tempfile = "3"
filetime = "0.2"

# Solo-developer profile: keep backtrace line numbers (the daily tracking
# need) while dropping full DWARF for the 400+ dependency crates — they are
# execution passers-by, never debug targets. opt-level=1 makes dependency
# code (serde, tauri, tokio internals) noticeably faster in test/dev runs.
# Semantics unchanged: debug-assertions stay on at every level.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 1
